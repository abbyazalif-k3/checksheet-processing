<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Cek Sheet Digital — Pabrik</title>
<style>
  :root{
    --ink:#1B2A32; --ink-soft:#5C6B70; --bg:#F4F6F8; --surface:#FFFFFF;
    --amber:#F2B84B; --amber-dark:#C88420; --green:#35C77A; --green-bg:#E8F3ED;
    --red:#B5442E; --red-bg:#FBEAE6; --line:#D9E0E3;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;}
  header{background:#102630;color:#fff;padding:14px 36px 12px;position:sticky;top:0;z-index:20;border-bottom:1px solid #2C4650;box-shadow:0 4px 18px rgba(0,0,0,.18);}
  header .row{display:flex;align-items:center;max-width:1440px;margin:0 auto;}
  .brand-block{display:flex;align-items:center;gap:20px;min-width:0;}
  .brand-logo{width:170px;height:46px;object-fit:contain;filter:drop-shadow(0 0 2px rgba(255,255,255,.7));flex-shrink:0;}
  .brand-title{border-left:1px solid rgba(196,210,214,.45);padding-left:20px;}
  header .eyebrow{font-size:13px;letter-spacing:.18em;color:var(--amber);font-weight:700;text-transform:uppercase;}
  header h1{font-size:28px;line-height:1.05;margin:5px 0 0;font-weight:700;letter-spacing:0;}
  .stamp{display:none;border:2px solid var(--amber);color:var(--amber);border-radius:8px;padding:6px 12px;text-align:center;transform:rotate(-3deg);line-height:1.1;}
  .stamp.complete{border-color:#6ee7b7;color:#6ee7b7;}
  .stamp .label{font-size:9px;letter-spacing:.15em;text-transform:uppercase;}
  .stamp .num{font-size:16px;font-weight:700;}

  .app-body{display:flex;align-items:flex-start;min-height:calc(100vh - 138px);}
  nav{display:flex;flex:0 0 240px;flex-direction:column;gap:6px;background:#10232C;border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:138px;height:calc(100vh - 138px);z-index:10;}
  nav button{width:100%;border:1px solid transparent;border-radius:8px;background:transparent;text-align:left;padding:13px 14px;font-size:13px;font-weight:600;color:#91A3AA;cursor:pointer;}
  nav button::before{display:inline-block;width:22px;color:var(--amber);font-size:15px;}
  nav button[data-tab="isi"]::before{content:"▣";}
  nav button[data-tab="riwayat"]::before{content:"◷";}
  nav button[data-tab="kelola"]::before{content:"⚙";}
  nav button.active{color:#fff;background:#1B3945;border-color:#2C5968;box-shadow:inset 3px 0 var(--amber);}
  nav button:hover{background:#17323D;color:#fff;}
  .sidebar-logout{margin-top:auto !important;color:#91A3AA !important;}
  .sidebar-logout::before{content:"↪" !important;}

  main{flex:1;min-width:0;padding:32px clamp(20px,4vw,56px) 80px;max-width:1440px;margin:0 auto;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px;box-shadow:0 8px 24px rgba(0,0,0,.12);margin-bottom:16px;}
  .area-row{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:none;background:var(--surface);cursor:pointer;}
  .area-name{font-weight:600;}
  .area-code{font-size:12px;color:#9aa3a6;font-family:monospace;margin-top:2px;}
  .area-fieldcount{font-size:11px;color:#9aa3a6;margin-top:4px;}
  .badge{font-size:10px;font-weight:700;padding:4px 8px;border-radius:99px;}
  .badge.done{color:var(--green);background:var(--green-bg);}
  .badge.pending{color:var(--amber-dark);background:#FBF2E2;}
  .badge.warn{color:var(--red);background:var(--red-bg);display:flex;align-items:center;gap:4px;}
  .badge.confirmed{color:var(--green);background:var(--green-bg);}
  .badge.unconfirmed{color:var(--red);background:var(--red-bg);}

  label{font-size:12px;font-weight:600;color:var(--ink-soft);display:block;margin-bottom:6px;}
  input[type=text],input[type=number],input[type=date],textarea,select{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink);}
  input::placeholder,textarea::placeholder{color:#87949A;opacity:1;}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--amber);border-color:var(--amber);}
  .shift-row{display:flex;gap:8px;margin-bottom:14px;}
  .shift-btn{flex:1;padding:10px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;}
  .shift-btn.active{background:var(--ink);color:#fff;border-color:var(--ink);}

  .section-title{font-size:12px;font-weight:800;color:var(--ink);text-transform:uppercase;letter-spacing:.06em;background:#EFEDE6;padding:8px 12px;border-radius:8px;margin:14px 0 8px;}
  .section-title:first-child{margin-top:0;}

  .field-row{margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid #F0EFEA;}
  .field-row:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
  .field-label{font-size:13px;color:#263A43;font-weight:600;margin-bottom:8px;}
  .field-check-row{display:flex;justify-content:space-between;align-items:center;}
  .ok-btns{display:flex;gap:6px;}
  .ok-btn{width:64px;padding:8px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:12px;font-weight:700;cursor:pointer;}
  .ok-btn.ok.sel{background:var(--green);color:#fff;border-color:var(--green);}
  .ok-btn.no.sel{background:var(--red);color:#fff;border-color:var(--red);}

  .rating-btns{display:flex;gap:6px;}
  .rating-btn{flex:1;min-height:60px;padding:9px 4px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:12px;font-weight:700;cursor:pointer;text-align:center;transition:background .15s ease,border-color .15s ease,transform .15s ease;}
  .rating-btn:hover{transform:translateY(-1px);}
  .rating-btn::first-letter{font-size:15px;}
  .rating-btn[data-r="1"]::before{content:"";display:inline-block;width:9px;height:9px;margin-right:6px;background:var(--red);border-radius:50%;vertical-align:1px;}
  .rating-btn[data-r="2"]::before{content:"";display:inline-block;width:9px;height:9px;margin-right:6px;background:var(--amber);border-radius:50%;vertical-align:1px;}
  .rating-btn[data-r="3"]::before{content:"";display:inline-block;width:9px;height:9px;margin-right:6px;background:var(--green);border-radius:50%;vertical-align:1px;}
  .rating-btn[data-r="1"].sel{background:var(--red);color:#fff;border-color:var(--red);}
  .rating-btn[data-r="2"].sel{background:var(--amber);color:#1B2A32;border-color:var(--amber);}
  .rating-btn[data-r="3"].sel{background:var(--green);color:#fff;border-color:var(--green);}
  .checklist-shell{max-width:820px;margin:0 auto;}
  .checklist-progress{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;font-size:13px;font-weight:700;color:var(--ink);}
  .progress-track{height:8px;background:#E6EBED;border-radius:99px;overflow:hidden;margin-bottom:18px;}
  .progress-fill{height:100%;background:var(--amber);border-radius:inherit;transition:width .2s ease;}
  .checklist-item-card{padding:24px;margin-bottom:14px;}
  .checklist-item-meta{display:flex;align-items:center;gap:8px;margin-bottom:8px;color:var(--ink-soft);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;}
  .checklist-item-number{color:var(--amber-dark);}
  .checklist-item-card .field-label{font-size:20px;line-height:1.3;color:var(--ink);margin-bottom:18px;}
  .checklist-item-card .temuan-input{margin-top:16px;}
  .checklist-item-card .temuan-input textarea{min-height:76px;padding:12px;font-size:14px;resize:vertical;}
  .checklist-nav{display:flex;gap:10px;}
  .checklist-nav button{flex:1;min-height:48px;}
  .checklist-nav button:disabled{opacity:.45;cursor:not-allowed;}
  .form-meta-card{padding:18px 20px;}
  .form-meta-card label{margin-bottom:5px;}
  .form-meta-card .shift-row{margin-bottom:10px;}
  .form-meta-card .shift-btn{min-height:42px;padding:8px 10px;}
  .corrective-card{padding:16px 20px;}
  .corrective-card > label{margin-bottom:8px;}
  .corrective-card #correctiveList:has(.empty){display:none;}
  .corrective-card:has(#correctiveList .empty){padding-bottom:12px;}
  .corrective-card .btn-secondary{padding:10px;}
  @media (max-width:520px){
    header{padding-top:12px;padding-bottom:12px;}
    .header-identity{margin-top:12px;padding-top:12px;gap:10px 12px;}
    .brand-block{gap:7px;}
    .brand-logo{height:38px;}
    .brand-title{padding-left:8px;}
    header h1{font-size:18px;}
    .form-meta-card{padding:14px 16px;}
    .form-meta-card .shift-row{gap:6px;margin-bottom:8px;}
    .form-meta-card .shift-btn{min-height:44px;padding:8px 6px;}
    .checklist-item-card{padding:18px;margin-left:0;margin-right:0;}
    .checklist-item-card .field-label{font-size:18px;}
    .rating-btns{gap:8px;}
    .rating-btn{min-height:72px;font-size:11px;line-height:1.25;}
    .checklist-nav{gap:8px;}
    .checklist-nav button{font-size:12px;padding:10px 8px;}
  }
  .temuan-input{margin-top:8px;}
  .temuan-input textarea{font-size:12.5px;}

  .btn-primary{width:100%;background:var(--amber);color:var(--ink);font-weight:700;border:none;padding:13px;border-radius:12px;font-size:14px;cursor:pointer;}
  .btn-secondary{width:100%;background:#fff;color:var(--ink-soft);font-weight:600;border:1px solid var(--line);padding:11px;border-radius:10px;font-size:13px;cursor:pointer;}
  .btn-dark{width:100%;background:var(--ink);color:#fff;font-weight:700;border:none;padding:12px;border-radius:12px;font-size:14px;cursor:pointer;margin-bottom:10px;}
  .link-btn{background:none;border:none;color:var(--ink-soft);font-size:12px;display:flex;align-items:center;gap:4px;cursor:pointer;padding:0 0 10px;}

  .error-box{background:var(--red-bg);color:var(--red);padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:12px;}
  .toast{position:fixed;left:16px;right:16px;bottom:16px;background:var(--green);color:#fff;padding:12px 16px;border-radius:10px;font-size:14px;z-index:40;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.15);}
  .toast.error{background:var(--red);}
  .empty{text-align:center;color:#9aa3a6;font-size:13px;padding:40px 0;}
  .chev{color:#c7c9c8;}

  .field-item{display:flex;justify-content:space-between;align-items:center;background:#FAFAF8;border-radius:8px;padding:8px 12px;margin-bottom:6px;font-size:13px;}
  .field-item .type{font-size:10px;color:#9aa3a6;margin-left:8px;}
  .del-x{color:var(--red);background:none;border:none;cursor:pointer;font-size:14px;}
  .add-field-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px;}
  .add-field-grid input,.add-field-grid select{font-size:12px;padding:8px;}
  .add-field-full{grid-column:1 / -1;display:flex;gap:6px;}
  .add-field-full button{background:var(--ink);color:#fff;border:none;border-radius:8px;padding:0 16px;font-size:13px;cursor:pointer;}

  .setup-banner{background:#FBF2E2;border:1px solid var(--amber);border-radius:10px;padding:14px;font-size:13px;line-height:1.5;margin-bottom:14px;}
  .setup-banner code{background:#fff;padding:1px 5px;border-radius:4px;font-size:12px;}
  .loading{text-align:center;padding:60px 0;color:#9aa3a6;}
  .entry-header{display:flex;justify-content:space-between;align-items:flex-start;}
  .entry-meta{font-size:12px;color:#9aa3a6;margin-top:2px;}
  .entry-section{font-size:11px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;margin:10px 0 4px;}
  .entry-field-row{display:flex;justify-content:space-between;align-items:flex-start;font-size:12.5px;padding:4px 0;gap:8px;}
  .entry-field-row .lbl{color:#5C6B70;}
  .entry-field-row .rt{font-weight:700;padding:2px 8px;border-radius:6px;white-space:nowrap;}
  .rt1{background:var(--red-bg);color:var(--red);} .rt2{background:#FBF2E2;color:var(--amber-dark);} .rt3{background:var(--green-bg);color:var(--green);}
  .entry-temuan{font-size:11.5px;color:#9aa3a6;font-style:italic;margin-top:1px;}
  .entry-actions{display:flex;gap:10px;margin-top:10px;}
  .entry-actions button{font-size:12px;background:none;border:none;color:var(--ink-soft);text-decoration:underline;cursor:pointer;padding:0;}
  .history-card{cursor:pointer;padding:18px 20px;transition:border-color .15s ease,box-shadow .15s ease,transform .15s ease;}
  .history-card:hover{border-color:#B7C7CD;box-shadow:0 5px 16px rgba(27,42,50,.1);transform:translateY(-1px);}
  .history-card:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
  .history-card .entry-header{gap:16px;}
  .history-title{display:flex;align-items:center;gap:10px;min-width:0;}
  .history-dot{width:9px;height:9px;border-radius:50%;background:#8B9AA0;flex:0 0 auto;}
  .history-card .area-name{font-size:16px;color:#172B34;font-weight:700;}
  .history-meta{margin-top:7px;font-size:12px;color:#5C6B70;}
  .history-meta b{color:var(--ink);font-weight:700;}
  .history-subline{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;}
  .history-subline span:not(:last-child)::after{content:"•";margin-left:10px;color:#9BA9AE;}
  .history-operator{margin-top:5px;font-size:12px;color:#5C6B70;}
  .history-bottomline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:6px;}
  .history-datetime{color:#5C6B70;}
  .history-points{color:#344B54;font-weight:700;white-space:nowrap;}
  .history-confirmation{margin-top:8px;font-size:12px;color:#5C6B70;}
  .history-comment{display:-webkit-box;line-clamp:2;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;margin-top:4px;font-size:12px;color:#5C6B70;}
  .history-findings{margin-top:14px;padding-top:12px;border-top:1px solid #F0EFEA;}
  .history-findings-title{font-size:13px;font-weight:800;color:var(--red);margin-bottom:8px;}
  .history-finding{padding:5px 0 5px 2px;font-size:12px;color:var(--ink);}
  .history-finding-label{font-weight:700;line-height:1.35;}
  .history-finding-comment{margin:2px 0 0 14px;color:var(--ink-soft);line-height:1.35;}
  .history-normal{margin-top:14px;padding-top:12px;border-top:1px solid #F0EFEA;font-size:12px;font-weight:700;color:var(--green);}
  .history-chevron{align-self:flex-end;color:#71838A;font-size:24px;line-height:1;}
  .toolbar{display:flex;gap:8px;margin-bottom:12px;}
  .toolbar select{flex:1;}
  .export-btn{background:#fff;border:1px solid var(--line);border-radius:8px;padding:0 14px;font-size:12px;font-weight:600;color:var(--ink-soft);cursor:pointer;white-space:nowrap;}
  .mode-control{display:flex;align-items:center;gap:10px;margin-bottom:16px;font-size:12px;color:var(--ink-soft);}
  .mode-control select{width:auto;min-width:150px;}
  .mode-session{display:flex;align-items:center;gap:8px;margin-left:auto;}
  .mode-session button{border:1px solid var(--line);background:#fff;color:var(--ink-soft);border-radius:8px;padding:7px 10px;font-size:12px;cursor:pointer;}
  .login-backdrop{position:fixed;inset:0;background:rgba(20,42,53,.55);display:grid;place-items:center;padding:16px;z-index:50;}
  .login-dialog{width:min(100%,400px);background:#fff;border-radius:12px;padding:24px;box-shadow:0 12px 32px rgba(0,0,0,.2);}
  .login-dialog h2{font-size:20px;margin:0 0 20px;color:var(--ink);}
  .login-dialog input{margin-bottom:12px;}
  .login-actions{display:flex;gap:8px;margin-top:6px;}
  .login-actions button{flex:1;}
  .login-error{background:var(--red-bg);color:var(--red);padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:12px;}
  .readonly-value{background:#FAFAF8;border:1px solid #F0EFEA;border-radius:8px;padding:10px 12px;font-size:13px;color:var(--ink);}

  .corrective-row{background:#FAFAF8;border-radius:10px;padding:10px;margin-bottom:8px;position:relative;}
  .corrective-row input{margin-bottom:6px;font-size:13px;}
  .corrective-row input:last-child{margin-bottom:0;}
  .corrective-del{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--red);cursor:pointer;}
  .confirm-row{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px;}
  .confirm-row input[type=checkbox]{width:20px;height:20px;flex-shrink:0;}
  .confirm-row span{font-size:13px;font-weight:600;}
  .header-identity{display:grid;width:100%;max-width:1350px;margin:10px auto 0;padding-top:10px;border-top:1px solid rgba(196,210,214,.45);grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;}
  .header-identity > div{display:flex;flex-direction:column;gap:3px;min-width:0;font-size:11px;}
  .header-identity span{color:#c4d0d3;font-size:12px;}
  .header-identity b{color:#fff;font-size:16px;overflow-wrap:anywhere;}
  #headerStatus{display:inline-flex;align-items:center;align-self:flex-start;gap:7px;color:#fff;border-radius:999px;padding:5px 12px;font-size:14px;}
  #headerStatus.confirmed{background:#19a957;}
  #headerStatus.unconfirmed{background:var(--amber-dark);}
  #headerStatus::before{content:"✓";display:inline-grid;place-items:center;width:18px;height:18px;background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.75);border-radius:50%;font-size:12px;font-weight:800;}
  #headerStatus.unconfirmed::before{content:"";width:10px;height:10px;background:#f59e0b;border:none;}
  @media (max-width:520px){
    .header-identity{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px;margin-top:16px;padding-top:16px;}
    header{padding:16px 14px 18px;}
    .brand-block{gap:8px;}
    .brand-logo{width:116px;height:44px;}
    .brand-title{padding-left:10px;}
    header .eyebrow{font-size:9px;letter-spacing:.14em;}
    header h1{font-size:19px;margin-top:5px;}
    .header-identity span{font-size:11px;}
    .header-identity b{font-size:13px;}
    #headerStatus{gap:5px;padding:4px 8px;font-size:11px;}
      #headerStatus::before{width:17px;height:17px;font-size:11px;}
    nav button{padding:12px 4px;font-size:11px;}
    main{padding:18px 14px 60px;}
    .card{padding:18px;border-radius:14px;}
  }
  @media (max-width:900px) and (min-width:521px){
    header{padding:20px 24px 18px;}
    .brand-logo{width:170px;height:52px;}
    .brand-title{padding-left:18px;}
    header .eyebrow{font-size:13px;}
    header h1{font-size:28px;}
    .header-identity{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 22px;margin-top:18px;padding-top:18px;}
    .header-identity span{font-size:14px;}
    .header-identity b{font-size:18px;}
    nav{flex-basis:190px;padding:20px 10px;}
    .app-body{min-height:calc(100vh - 166px);}
    nav{top:166px;height:calc(100vh - 166px);}
  }
  @media (max-width:520px){
    .app-body{display:block;min-height:0;}
    nav{position:sticky;top:0;width:100%;height:auto;flex-direction:row;gap:4px;overflow-x:auto;padding:8px 10px;background:#10232C;border-right:0;border-bottom:1px solid var(--line);}
    nav button{flex:1 1 0;width:auto;min-width:0;text-align:center;padding:10px 4px;font-size:11px;white-space:normal;}
    nav button::before{width:auto;margin-right:5px;}
    .sidebar-logout{display:block !important;margin-top:0 !important;}
    main{padding:18px 14px 60px;}
    .history-card{padding:16px;}
    .history-card .entry-header{align-items:flex-start;flex-direction:column;gap:8px;}
    .history-card .badge{align-self:flex-start;}
    .history-card .area-name{font-size:15px;}
    .history-bottomline{align-items:flex-start;}
    .history-datetime{font-size:11px;}
    .history-chevron{position:absolute;right:16px;bottom:14px;}
  }
  @media (max-width:768px){
    body{width:100%;max-width:100%;overflow-x:hidden;}
    header{padding:6px 10px 8px;}
    header .row{width:100%;}
    .brand-block{gap:8px;}
    .brand-logo{width:104px;height:32px;}
    .brand-title{padding-left:8px;}
    header .eyebrow{font-size:8px;letter-spacing:.12em;}
    header h1{font-size:17px;margin-top:3px;}
    .header-identity{grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 8px;margin-top:6px;padding-top:6px;}
    .header-identity > div{gap:1px;font-size:10px;line-height:1.15;}
    .header-identity span{font-size:11px;}
    .header-identity b{font-size:12px;line-height:1.15;}
    #headerStatus{padding:3px 7px;font-size:10px;}
    #headerStatus::before{width:14px;height:14px;font-size:9px;}
    .app-body{display:block;width:100%;min-height:0;}
    nav{position:sticky;top:0;width:100%;height:auto;flex:none;flex-direction:row;gap:4px;overflow-x:auto;padding:6px;border-right:none;border-bottom:1px solid var(--line);}
    nav button{flex:1 1 0;min-width:0;width:auto;min-height:44px;padding:9px 5px;text-align:center;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

<script>
function applyResponsiveMode(){
  const isTouchDevice =
    navigator.maxTouchPoints > 0 ||
    'ontouchstart' in window ||
    (window.matchMedia && window.matchMedia('(pointer: coarse)').matches);

  const isSmallViewport = window.innerWidth <= 768;

  document.body.classList.toggle(
    'mobile-layout',
    isTouchDevice || isSmallViewport
  );
}

applyResponsiveMode();
window.addEventListener('resize', applyResponsiveMode);
window.addEventListener('orientationchange', applyResponsiveMode);

/* ====== KONFIGURASI ====== */
const API_URL = "https://script.google.com/macros/s/AKfycbzo9BW1_CWC509FBE-XcBfqKvpZKrCAaocJa8TjmaZ7x1ak7IDmvbU1RuKO2Rm9Chk/exec";

const SHIFTS = ["DS (Day Shift)","NS (Night Shift)"];
const CREWS = ["Crew A","Crew B","Crew C","Crew D"];
const APP_MODES = { OPERATOR:"OPERATOR", LH_FOREMAN:"LH_FOREMAN" };
let activeMode = null;
/* session: null sebelum login. Setelah login berhasil, berisi
   { role, token, areaId, areaName } untuk OPERATOR
   atau { role, token, userId, nama } untuk LH_FOREMAN.

   Token disimpan sementara di memory dan sessionStorage agar
   session tetap bertahan saat halaman di-refresh.
   PIN tidak pernah disimpan. */
let session = null;
const FIELD_TYPES = [
  {value:"rating",label:"Rating (Buruk/Bagus/Sangat Bagus)"},
  {value:"checkbox",label:"Centang (OK/Tidak)"},
  {value:"number",label:"Angka"},
  {value:"text",label:"Catatan singkat"}
];
const RATING_LABELS = {1:"Tidak Aman",2:"Normal",3:"Sangat Normal"};

let state = { areas: [], templates: {}, entries: [], loaded:false };
let tab = "isi";
let selectedArea = null;
let selectedEntryId = null;
let formValues = {};
let activeFieldIndex = 0;
let formShift = SHIFTS[0];
let formCrew = CREWS[0];
let formOperator = "";
let formError = "";
let formCorrective = [];
let formLHForeman = "";
let formLHComment = "";
let confirmationError = "";
let lhSession = null;
let loginRole = null;      // null | "OPERATOR" | "LH_FOREMAN" (pilihan di layar login)
let loginUserId = "";
let loginPin = "";
let loginAreaId = "";
let loginAreaPin = "";
let loginBusy = false;
let loginError = "";

function saveSession(){
  if (!session){
    sessionStorage.removeItem("checksheetSession");
    return;
  }
  const storedSession = session.role === "LH_FOREMAN"
    ? { role:session.role, token:session.token, userId:session.userId, nama:session.nama }
    : { role:session.role, token:session.token, areaId:session.areaId, areaName:session.areaName };
  sessionStorage.setItem("checksheetSession", JSON.stringify(storedSession));
}

function restoreSession(){
  try {
    const raw = sessionStorage.getItem("checksheetSession");
    if (!raw) return false;
    const saved = JSON.parse(raw);
    if (!saved || !saved.role || !saved.token || (saved.role !== "OPERATOR" && saved.role !== "LH_FOREMAN")){
      sessionStorage.removeItem("checksheetSession");
      return false;
    }
    session = saved.role === "LH_FOREMAN"
      ? { role:saved.role, token:saved.token, userId:saved.userId || "", nama:saved.nama || "" }
      : { role:saved.role, token:saved.token, areaId:saved.areaId || "", areaName:saved.areaName || "" };
    if (saved.role === "LH_FOREMAN"){
      lhSession = { userId:session.userId, nama:session.nama, role:session.role, authToken:session.token };
      activeMode = APP_MODES.LH_FOREMAN;
    } else {
      lhSession = null;
      activeMode = APP_MODES.OPERATOR;
    }
    return true;
  } catch(e){
    sessionStorage.removeItem("checksheetSession");
    return false;
  }
}

function clearStoredSession(){
  sessionStorage.removeItem("checksheetSession");
}

function uid(p){ return p+"_"+Math.random().toString(36).slice(2,10); }
function todayKey(d){ return new Date(d).toISOString().slice(0,10); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function groupBySection(fields){
  const groups = {};
  fields.forEach(f=>{
    const sec = f.section || "Umum";
    if (!groups[sec]) groups[sec] = [];
    groups[sec].push(f);
  });
  return groups;
}
function compareOrder(a, b){
  const aParts = String(a.order ?? "").split(".").map(part => Number.parseInt(part, 10) || 0);
  const bParts = String(b.order ?? "").split(".").map(part => Number.parseInt(part, 10) || 0);
  const maxLen = Math.max(aParts.length, bParts.length);

  for (let i = 0; i < maxLen; i++) {
    const av = aParts[i] ?? 0;
    const bv = bParts[i] ?? 0;
    if (av !== bv) return av - bv;
  }

  return 0;
}

async function apiPost(action, data){
  try {
    const res = await fetch(API_URL, { method:"POST", headers:{"Content-Type":"text/plain"}, body: JSON.stringify({action, data}) });
    if (!res.ok) return { ok:false, error:"Server tidak dapat memproses permintaan." };
    return await res.json();
  } catch (error) {
    return { ok:false, error:"Gagal terhubung ke server. Periksa koneksi internet lalu coba lagi." };
  }
}

const inFlightActions = new Set();
async function runApiAction(action, data, button, loadingText){
  if (inFlightActions.has(action)) return null;
  inFlightActions.add(action);
  const defaultText = button ? button.textContent : "";
  if (button){
    button.disabled = true;
    button.textContent = loadingText;
  }
  try {
    return await apiPost(action, data);
  } finally {
    inFlightActions.delete(action);
    if (button){
      button.disabled = false;
      button.textContent = defaultText;
    }
  }
}

function toast(msg, isError){
  const el = document.createElement("div");
  el.className = "toast" + (isError ? " error":"");
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2500);
}

const SESSION_EXPIRED_MESSAGES = [
  "Sesi LH/Foreman tidak valid atau sudah berakhir",
  "Sesi Operator tidak valid atau sudah berakhir",
  "Sesi tidak valid atau telah berakhir",
  "Akses ditolak. Token tidak valid"
];
function handleSessionFailure(res){
  if (!res || !res.error || SESSION_EXPIRED_MESSAGES.indexOf(res.error) === -1) return false;
  logout();
  toast("Sesi berakhir. Silakan login kembali.", true);
  return true;
}

function getDataTokenPayload(){
  if (!session) return {};
  return session.role === "OPERATOR" ? { areaToken: session.token } : { authToken: session.token };
}

async function loadData(){
  if (!session) return;
  if (!API_URL || API_URL.indexOf("TEMPEL_URL") === 0) {
    document.getElementById("main").innerHTML = `<div class="setup-banner"><b>Belum terhubung ke Google Sheets.</b> Deploy backend Apps Script, lalu isi API_URL di file ini.</div>`;
    return;
  }
  try {
    const data = await apiPost("getData", getDataTokenPayload());
    if (!data.ok){
      if (handleSessionFailure(data)) return;
      document.getElementById("main").innerHTML = `<div class="setup-banner">Gagal memuat data. (${esc(data.error||"")})</div>`;
      return;
    }
    applyData(data);
    state.loaded = true;
    render();
  } catch(err){
    document.getElementById("main").innerHTML = `<div class="setup-banner">Gagal memuat data. Cek koneksi internet / URL API. (${esc(err.message)})</div>`;
  }
}
function applyData(data){
  state.areas = data.areas.map(a => ({...a, active: a.active === true || a.active === "TRUE" || a.active === "true"}));
  const templates = {};
  data.templates.forEach(t => { if (!templates[t.areaId]) templates[t.areaId]=[]; templates[t.areaId].push(t); });
  state.templates = templates;
  state.entries = data.entries;
}
async function refreshSilently(){
  if (!session) return;
  try{
    const data = await apiPost("getData", getDataTokenPayload());
    if (!data.ok){ handleSessionFailure(data); return; }
    applyData(data);
  } catch(e){}
}

function updateHeaderIdentity(){
  const selectedEntry = state.entries.find(entry => entry.id === selectedEntryId);
  const operator = activeMode === APP_MODES.LH_FOREMAN && selectedEntry ? selectedEntry.operator : formOperator.trim();
  const crew = activeMode === APP_MODES.LH_FOREMAN && selectedEntry ? selectedEntry.crew : formCrew;
  const lhForeman = activeMode === APP_MODES.LH_FOREMAN
    ? (selectedEntry ? selectedEntry.lhForeman : lhSession?.nama)
    : "-";
  const confirmed = selectedEntry && (selectedEntry.confirmed === true || selectedEntry.confirmed === "TRUE" || selectedEntry.confirmed === "true");
  document.getElementById("headerOperator").textContent = operator || "-";
  document.getElementById("headerCrew").textContent = crew;
  document.getElementById("headerLHForeman").textContent = lhForeman || "-";
  const statusEl = document.getElementById("headerStatus");
  statusEl.className = confirmed ? "confirmed" : "unconfirmed";
  statusEl.textContent = confirmed ? "Terkonfirmasi" : "Menunggu Konfirmasi";
}

// ---------- LAYAR LOGIN (gerbang sebelum aplikasi) ----------

function renderLoginScreen(){
  const roleButtons = `<div class="login-role-select">
    <button type="button" class="${loginRole==='OPERATOR'?'active':''}" data-select-role="OPERATOR">Operator Area</button>
    <button type="button" class="${loginRole==='LH_FOREMAN'?'active':''}" data-select-role="LH_FOREMAN">LH / Foreman</button>
  </div>`;

  let formHtml = `<div class="login-hint">Pilih jenis akses untuk melanjutkan.</div>`;
  if (loginRole === "OPERATOR"){
    formHtml = `<div class="login-form">
      <label for="opAreaIdInput">Area ID</label>
      <input type="text" id="opAreaIdInput" value="${esc(loginAreaId)}" placeholder="Masukkan Area ID" autocomplete="off" ${loginBusy?'disabled':''}>
      <label for="opPinInput">PIN</label>
      <input type="password" id="opPinInput" value="${esc(loginAreaPin)}" placeholder="Masukkan PIN" autocomplete="off" ${loginBusy?'disabled':''}>
      ${loginError ? `<div class="login-error-box">${esc(loginError)}</div>` : ""}
      <button type="button" class="btn-primary" data-login-operator="1" ${loginBusy?'disabled':''}>${loginBusy?'Memproses…':'Masuk'}</button>
      <button type="button" class="login-back" data-back-role="1">‹ Ganti jenis akses</button></div>`;
  } else if (loginRole === "LH_FOREMAN"){
    formHtml = `<div class="login-form">
      <label for="lhUserIdInput">User ID</label>
      <input type="text" id="lhUserIdInput" value="${esc(loginUserId)}" placeholder="Masukkan User ID" autocomplete="username" ${loginBusy?'disabled':''}>
      <label for="lhPinInput">PIN</label>
      <input type="password" id="lhPinInput" value="${esc(loginPin)}" placeholder="Masukkan PIN" autocomplete="current-password" ${loginBusy?'disabled':''}>
      ${loginError ? `<div class="login-error-box">${esc(loginError)}</div>` : ""}
      <button type="button" class="btn-primary" data-login-lh="1" ${loginBusy?'disabled':''}>${loginBusy?'Memproses…':'Masuk'}</button>
      <button type="button" class="login-back" data-back-role="1">‹ Ganti jenis akses</button></div>`;
  }

  return `<div class="login-page">
    <section class="login-card" aria-label="Login Checksheet Digital">
      <div class="login-brand">
        <div class="login-logo-wrap"><img class="login-logo" src="logo-header-transparent.png" alt="Archi Indonesia dan MSM TTN"></div>
        <h1 class="login-title"><span>Checksheet Digital</span><span class="login-title-accent">Processing Plant</span></h1>
        <p class="login-subtitle">Sistem checksheet digital untuk inspeksi area dan keselamatan kerja.</p>
      </div>
      ${roleButtons}
      ${formHtml}
      <footer class="login-footer">Sistem aman &bull; Data Anda dilindungi<strong>CHECKSHEET DIGITAL &bull; PROCESSING PLANT</strong></footer>
    </section>
  </div>`;
}

function selectLoginRole(role){
  loginRole = role;
  loginError = "";
  renderRoot();
}

async function loginAreaOperator(){
  const areaId = loginAreaId.trim();
  const pin = loginAreaPin.trim();
  if (!areaId || !pin){
    loginError = "Area ID dan PIN wajib diisi.";
    renderRoot();
    return;
  }
  loginBusy = true; loginError = "";
  renderRoot();
  let res;
  try {
    res = await apiPost("loginAreaOperator", { areaId, pin });
  } catch (err){
    loginBusy = false;
    loginError = "Gagal terhubung ke server: " + err.message;
    renderRoot();
    return;
  }
  loginBusy = false;
  if (res.ok === true){
    session = { role: "OPERATOR", token: res.areaToken, areaId: res.resolvedAreaId, areaName: res.areaName };
    activeMode = APP_MODES.OPERATOR;
    loginAreaId = ""; loginAreaPin = ""; loginError = ""; loginRole = null;
    saveSession();
    enterApp();
  } else {
    loginError = res.error || "Login gagal.";
    renderRoot();
  }
}

async function loginLHForeman(){
  const userId = loginUserId.trim();
  const pin = loginPin.trim();
  if (!userId || !pin){
    loginError = "User ID dan PIN wajib diisi.";
    renderRoot();
    return;
  }
  const res = await runApiAction("loginLHForeman", { userId, pin }, document.querySelector("[data-login-lh]"), "Memproses...");
  if (!res) return;
  if (res.ok === true){
    lhSession = { userId: res.userId, nama: res.nama, role: res.role, authToken: res.authToken };
    session = { role: "LH_FOREMAN", token: res.authToken, userId: res.userId, nama: res.nama };
    activeMode = APP_MODES.LH_FOREMAN;
    loginUserId = ""; loginPin = ""; loginError = ""; loginRole = null;
    saveSession();
    enterApp();
  } else {
    loginError = res.error || "Login gagal.";
    renderRoot();
  }
}

function enterApp(){
  tab = "isi";
  selectedArea = session.role === "OPERATOR" ? session.areaId : null;
  selectedEntryId = null;
  confirmationError = "";
  state = { areas: [], templates: {}, entries: [], loaded:false };
  renderRoot();
}

function logout(){
  clearStoredSession();
  session = null;
  lhSession = null;
  activeMode = null;
  tab = "isi";
  selectedArea = null;
  selectedEntryId = null;
  formValues = {}; formOperator = ""; formCrew = CREWS[0]; formError = ""; formCorrective = [];
  state = { areas: [], templates: {}, entries: [], loaded:false };
  loginRole = null;
  loginUserId = ""; loginPin = "";
  loginAreaId = ""; loginAreaPin = "";
  loginBusy = false; loginError = "";
  renderRoot();
}

function attachLoginHandlers(){
  document.querySelectorAll("[data-select-role]").forEach(el=>{
    el.onclick = ()=> selectLoginRole(el.dataset.selectRole);
  });
  const backRole = document.querySelector("[data-back-role]");
  if (backRole) backRole.onclick = ()=>{ loginRole = null; loginError = ""; renderRoot(); };

  const opAreaIdInput = document.getElementById("opAreaIdInput");
  if (opAreaIdInput){
    opAreaIdInput.oninput = (e)=>{ loginAreaId = e.target.value; };
    opAreaIdInput.onkeydown = (e)=>{ if (e.key === "Enter") loginAreaOperator(); };
  }
  const opPinInput = document.getElementById("opPinInput");
  if (opPinInput){
    opPinInput.oninput = (e)=>{ loginAreaPin = e.target.value; };
    opPinInput.onkeydown = (e)=>{ if (e.key === "Enter") loginAreaOperator(); };
  }
  const loginOperatorBtn = document.querySelector("[data-login-operator]");
  if (loginOperatorBtn) loginOperatorBtn.onclick = loginAreaOperator;

  const lhUserIdInput = document.getElementById("lhUserIdInput");
  if (lhUserIdInput){
    lhUserIdInput.oninput = (e)=>{ loginUserId = e.target.value; };
    lhUserIdInput.onkeydown = (e)=>{ if (e.key === "Enter") loginLHForeman(); };
  }
  const lhPinInput = document.getElementById("lhPinInput");
  if (lhPinInput){
    lhPinInput.oninput = (e)=>{ loginPin = e.target.value; };
    lhPinInput.onkeydown = (e)=>{ if (e.key === "Enter") loginLHForeman(); };
  }
  const loginLHBtn = document.querySelector("[data-login-lh]");
  if (loginLHBtn) loginLHBtn.onclick = loginLHForeman;
}

// ---------- GERBANG UTAMA: LOGIN vs APLIKASI ----------
function renderRoot(){
  const authGate = document.getElementById("authGate");
  const headerEl = document.querySelector("header");
  const appBody = document.querySelector(".app-body");

  if (!session){
    headerEl.style.display = "none";
    appBody.style.display = "none";
    authGate.style.display = "block";
    authGate.innerHTML = renderLoginScreen();
    attachLoginHandlers();
    return;
  }

  authGate.style.display = "none";
  headerEl.style.display = "";
  appBody.style.display = "";

  if (!state.loaded){
    document.getElementById("main").innerHTML = `<div class="loading">Memuat data…</div>`;
    loadData();
    return;
  }
  const isiTabButton = document.querySelector('nav button[data-tab="isi"]');

if (isiTabButton) {
  isiTabButton.textContent =
    session && session.role === "LH_FOREMAN"
      ? "Verifikasi"
      : "AREA CHECKSHEET";
}
  render();
}

function setTab(t){ tab = t; selectedArea = session && session.role === "OPERATOR" ? session.areaId : null; selectedEntryId = null; render(); }

function getChecklistFields(areaId){
  return (state.templates[areaId]||[]).slice().sort(compareOrder);
}

function isFieldComplete(field){
  const value = formValues[field.id] || {};
  if (field.type === "rating") return value.rating !== undefined;
  if (field.type === "checkbox") return value.value !== undefined;
  return value.value !== undefined && value.value !== "";
}

function setActiveFieldIndex(nextIndex){
  const area = state.areas.find(a=>a.id===selectedArea);
  const fields = area ? getChecklistFields(area.id) : [];
  if (fields.length===0){ activeFieldIndex = 0; return; }
  activeFieldIndex = Math.max(0, Math.min(nextIndex, fields.length-1));
  render();
}

function render(){
  if (activeMode === APP_MODES.OPERATOR && tab === "kelola") tab = "isi";
  updateHeaderIdentity();
  document.querySelectorAll("nav button").forEach(b=>{
    const isKelola = b.dataset.tab === "kelola";
    b.style.display = isKelola && activeMode !== APP_MODES.LH_FOREMAN ? "none" : "";
    b.classList.toggle("active", b.dataset.tab === tab);
  });
  const activeAreas = state.areas.filter(a=>a.active);
  const t = todayKey(new Date());
  const doneToday = new Set(state.entries.filter(e=>todayKey(e.datetime)===t).map(e=>e.areaId));
  const doneCount = activeAreas.filter(a=>doneToday.has(a.id)).length;
  const stampEl = document.getElementById("stamp");
  stampEl.className = "stamp" + (activeAreas.length>0 && doneCount>=activeAreas.length ? " complete":"");
  stampEl.querySelector(".num").textContent = `${doneCount}/${activeAreas.length}`;

  const main = document.getElementById("main");
  if (tab === "isi") main.innerHTML = renderIsi();
  else if (tab === "kelola") main.innerHTML = renderKelola();
  else main.innerHTML = renderRiwayat();
  attachHandlers();
}

// ---------- TAB: ISI CEK SHEET ----------
function renderIsi(){
  if (selectedEntryId) return renderConfirmation();
  if (activeMode === APP_MODES.LH_FOREMAN) return renderEntryList();
  if (selectedArea){
    const areaExists = state.areas.some(a=>a.id===selectedArea);
    if (areaExists) return renderForm();
    selectedArea = null;
  }
  const activeAreas = state.areas.filter(a=>a.active);
  if (activeAreas.length===0) return `<div class="empty">Belum ada area aktif. Tambahkan lewat tab Kelola Area.</div>`;
  const t = todayKey(new Date());
  return activeAreas.map(a=>{
    const fields = state.templates[a.id] || [];
    const done = state.entries.some(e=>e.areaId===a.id && todayKey(e.datetime)===t);
    return `<button class="card area-row" data-open-area="${esc(a.id)}">
      <div>
        <div class="area-name">${esc(a.name)}</div>
        <div class="area-code">${esc(a.code)}</div>
        <div class="area-fieldcount">${fields.length} poin cek</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <span class="badge ${done?'done':'pending'}">${done?'Sudah diisi':'Belum'}</span>
        <span class="chev">›</span>
      </div>
    </button>`;
  }).join("");
}

function isConfirmed(entry){
  return entry.confirmed === true || entry.confirmed === "TRUE" || entry.confirmed === "true";
}

function openEntryForConfirmation(entry){
  selectedEntryId = entry.id;
  formLHForeman = entry.lhForeman || "";
  formLHComment = entry.lhComment || "";
  confirmationError = "";
  tab = "isi";
  render();
}

function renderEntryList(){
  const sorted = state.entries.slice().sort((a,b)=> new Date(b.datetime) - new Date(a.datetime));
  if (sorted.length===0) return `<div class="empty">Belum ada pemeriksaan tersimpan.</div>`;
  return sorted.map(entry=>`<button class="card area-row" data-open-entry="${esc(entry.id)}">
    <div>
      <div class="area-name">${esc(entry.areaName)}</div>
      <div class="entry-meta">${esc(entry.operator)} · ${esc(entry.crew)} · ${esc(entry.shift)}</div>
      <div class="entry-meta">${new Date(entry.datetime).toLocaleString('id-ID')}</div>
    </div>
    <span class="badge ${isConfirmed(entry)?'confirmed':'unconfirmed'}">${isConfirmed(entry)?'Terkonfirmasi':'Menunggu Konfirmasi'}</span>
  </button>`).join("");
}

function renderEntryChecklist(entry){
  const fields = (state.templates[entry.areaId]||[]).slice().sort(compareOrder);
  const groups = groupBySection(fields);
  const values = entry.values || {};
  let html = "";
  Object.keys(groups).forEach(sec=>{
    html += `<div class="section-title">${esc(sec)}</div>`;
    groups[sec].forEach(field=>{
      const value = values[field.id] || {};
      let result = "-";
      if (field.type === "rating" && value.rating) result = `<span class="rt rt${value.rating}">${RATING_LABELS[value.rating]}</span>`;
      else if (field.type === "checkbox") result = value.value === "ok" ? `<span class="rt rt3">OK</span>` : `<span class="rt rt1">Tidak</span>`;
      else if (value.value !== undefined && value.value !== "") result = esc(value.value);
      html += `<div class="field-row"><div class="field-label">${esc(field.label)}</div><div class="entry-field-row"><span class="lbl">Hasil</span>${result}</div>`;
      if (field.type === "rating") html += `<div class="readonly-value">Temuan: ${esc(value.temuan || "-")}</div>`;
      html += `</div>`;
    });
  });
  const corrective = entry.correctiveActions || [];
  html += `<div class="section-title">Tindakan Perbaikan &amp; Pencegahan</div>`;
  html += corrective.length ? corrective.map(action=>`<div class="corrective-row">
    <div class="readonly-value">No WR: ${esc(action.noWR || "-")}</div>
    <div class="readonly-value">Deskripsi: ${esc(action.deskripsi || "-")}</div>
    <div class="readonly-value">Tanggung jawab: ${esc(action.tanggungJawab || "-")}</div>
    <div class="readonly-value">Tenggat pengerjaan: ${esc(action.tenggat || "-")}</div>
  </div>`).join("") : `<div class="empty" style="padding:14px 0;">Tidak ada tindakan</div>`;
  return html;
}

function renderConfirmation(){
  const entry = state.entries.find(item => item.id === selectedEntryId);
  if (!entry) return `<div class="error-box">Pemeriksaan tidak ditemukan.</div>`;
  const confirmed = isConfirmed(entry);
  if (activeMode === APP_MODES.OPERATOR){
    return `<button class="link-btn" data-close-entry="1">✕ Kembali ke riwayat</button>
      <div class="card">
        <div class="area-name">${esc(entry.areaName)}</div>
        <div class="entry-meta">Operator: ${esc(entry.operator)}</div>
        <div class="entry-meta">Crew: ${esc(entry.crew)}</div>
        <div class="entry-meta">Shift: ${esc(entry.shift)}</div>
        <div class="entry-meta">Tanggal/Waktu: ${new Date(entry.datetime).toLocaleString('id-ID')}</div>
      </div>
      <div class="card">${renderEntryChecklist(entry)}</div>
      ${confirmed ? `<div class="card">
        <div class="section-title">HASIL KONFIRMASI LH / FOREMAN</div>
        ${entry.lhForeman ? `<div class="entry-field-row"><span class="lbl">LH/Foreman</span><span>${esc(entry.lhForeman)}</span></div>` : ""}
        ${entry.lhComment ? `<div class="readonly-value">Komentar: ${esc(entry.lhComment)}</div>` : ""}
        <div class="badge confirmed" style="display:inline-block;margin-top:8px;">🟢 Terkonfirmasi</div>
      </div>` : `<div class="card"><div class="badge pending">🟡 Menunggu Konfirmasi</div></div>`}`;
  }
  return `<button class="link-btn" data-close-entry="1">✕ Kembali ke daftar pemeriksaan</button>
    <div class="card form-meta-card">
      <div class="area-name">${esc(entry.areaName)}</div>
      <div class="entry-meta">Area: ${esc(entry.areaName)}</div>
      <div class="entry-meta">Operator: ${esc(entry.operator)}</div>
      <div class="entry-meta">Crew: ${esc(entry.crew)}</div>
      <div class="entry-meta">Shift: ${esc(entry.shift)}</div>
      <div class="entry-meta">Tanggal/Waktu: ${new Date(entry.datetime).toLocaleString('id-ID')}</div>
    </div>
    <div class="card">${renderEntryChecklist(entry)}</div>
    <div class="card corrective-card">
      <div class="section-title">KONFIRMASI LH / FOREMAN</div>
      ${confirmed ? `<div class="readonly-value">Nama LH/Foreman: ${esc(entry.lhForeman || "-")}</div>
        <div class="readonly-value" style="margin-top:8px;">Komentar: ${esc(entry.lhComment || "-")}</div>
        <div class="badge confirmed" style="display:inline-block;margin-top:10px;">🟢 Terkonfirmasi</div>` : `
        <label for="lhForemanInput">Nama LH/Foreman</label>
        <input type="text" id="lhForemanInput" value="${esc(formLHForeman)}" placeholder="Masukkan nama">
        <label for="lhCommentInput" style="margin-top:12px;">Komentar LH / Foreman</label>
        <textarea id="lhCommentInput" rows="4" placeholder="Tuliskan komentar terhadap hasil checksheet...">${esc(formLHComment)}</textarea>
        ${confirmationError ? `<div class="error-box" style="margin-top:12px;margin-bottom:0;">${esc(confirmationError)}</div>` : ""}
        <button class="btn-primary" data-confirm-entry="1" style="margin-top:12px;">Konfirmasi Pemeriksaan</button>`}
    </div>`;
}

async function confirmEntry(){
  if (activeMode !== APP_MODES.LH_FOREMAN) return;
  const entry = state.entries.find(item => item.id === selectedEntryId);
  const name = formLHForeman.trim();
  const comment = formLHComment.trim();
  if (!entry) return;
  if (!name){ confirmationError = "Nama LH/Foreman wajib diisi."; render(); return; }
  if (isConfirmed(entry)){ render(); return; }
  toast("Mengonfirmasi…");
  const confirmButton = document.querySelector("[data-confirm-entry]");
  const res = await runApiAction("confirmEntry", {
    entryId: selectedEntryId,
    lhForeman: name,
    lhComment: comment,
    authToken: lhSession ? lhSession.authToken : ""
  }, confirmButton, "Memproses...");
  if (!res) return;
  if (res.ok){
    entry.lhForeman = res.lhForeman;
    entry.lhComment = res.lhComment;
    entry.confirmed = true;
    formLHForeman = res.lhForeman;
    formLHComment = res.lhComment;
    confirmationError = "";
    render();
    toast("Pemeriksaan terkonfirmasi");
  } else {
    if (handleSessionFailure(res)) return;
    confirmationError = res.error || "Gagal mengonfirmasi pemeriksaan.";
    render();
    toast("Gagal mengonfirmasi: "+confirmationError, true);
  }
}

function renderForm(){
  const area = state.areas.find(a=>a.id===selectedArea);
  const fields = getChecklistFields(area.id);
  const completedCount = fields.filter(isFieldComplete).length;
  const currentField = fields[activeFieldIndex] || null;
  const progressPercent = fields.length ? Math.round(completedCount / fields.length * 100) : 0;
  const itemHtml = currentField ? `<div class="card checklist-item-card">
      <div class="checklist-item-meta"><span class="checklist-item-number">Item ${activeFieldIndex + 1} / ${fields.length}</span><span>·</span><span>${esc(currentField.section || "Umum")}</span></div>
      ${renderField(currentField)}
    </div>` : `<div class="card"><div class="empty">Area ini belum punya poin cek.</div></div>`;
  const navigationHtml = fields.length ? `<div class="checklist-nav">
      <button type="button" class="btn-secondary" data-prev-field="1" ${activeFieldIndex===0?'disabled':''}>← Sebelumnya</button>
      <button type="button" class="btn-primary" data-next-field="1" ${activeFieldIndex===fields.length-1?'disabled':''}>Berikutnya →</button>
    </div>` : "";

  return `
    <button class="link-btn" data-cancel-form="1">✕ Batal, kembali ke daftar area</button>
    <div class="card"><div class="area-name">${esc(area.name)}</div><div class="area-code">${esc(area.code)}</div></div>
    <div class="card form-meta-card">
      <label>Shift</label>
      <div class="shift-row">
        ${SHIFTS.map(s=>`<button class="shift-btn ${formShift===s?'active':''}" data-shift="${esc(s)}">${s}</button>`).join("")}
      </div>
      <label>Nama Operator</label>
      <input type="text" id="operatorInput" placeholder="Masukkan nama" value="${esc(formOperator)}">
      <label>Crew</label>
      <div class="shift-row">
        ${CREWS.map(c=>`<button class="shift-btn ${formCrew===c?'active':''}" data-crew="${esc(c)}">${c}</button>`).join("")}
      </div>
    </div>
    <div class="checklist-shell">
      <div class="checklist-progress"><span>${completedCount} / ${fields.length} selesai</span><span>${progressPercent}%</span></div>
      <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="${fields.length}" aria-valuenow="${completedCount}"><div class="progress-fill" style="width:${progressPercent}%"></div></div>
      ${itemHtml}
      ${navigationHtml}
    </div>

    <div class="card corrective-card">
      <label style="margin-bottom:10px;">Tindakan Perbaikan &amp; Pencegahan (kalau ada temuan)</label>
      <div id="correctiveList">${renderCorrectiveList()}</div>
      <button class="btn-secondary" data-add-corrective="1">+ Tambah Tindakan</button>
    </div>

    ${formError ? `<div class="error-box">⚠ ${esc(formError)}</div>` : ""}
    <button class="btn-primary" data-submit-entry="1">Simpan Cek Sheet</button>
  `;
}

function renderField(f){
  const val = formValues[f.id] || {};
  if (f.type === "rating"){
    return `<div class="field-row">
      <div class="field-label">${esc(f.label)}</div>
      <div class="rating-btns">
        ${[1,2,3].map(r=>`<button class="rating-btn ${val.rating===r?'sel':''}" data-rating-field="${esc(f.id)}" data-r="${r}">${RATING_LABELS[r]}</button>`).join("")}
      </div>
      <div class="temuan-input">
        <textarea rows="1" placeholder="Temuan (opsional)" data-temuan-field="${esc(f.id)}">${esc(val.temuan)}</textarea>
      </div>
    </div>`;
  }
  if (f.type === "checkbox"){
    return `<div class="field-row field-check-row">
      <span class="field-label" style="margin-bottom:0;">${esc(f.label)}</span>
      <div class="ok-btns">
        <button class="ok-btn ok ${val.value==='ok'?'sel':''}" data-field="${f.id}" data-val="ok">✓ OK</button>
        <button class="ok-btn no ${val.value==='tidak'?'sel':''}" data-field="${f.id}" data-val="tidak">✕ Tidak</button>
      </div>
    </div>`;
  }
  if (f.type === "number"){
    return `<div class="field-row"><label>${esc(f.label)}</label>
      <input type="number" data-field-input="${esc(f.id)}" value="${esc(val.value)}"></div>`;
  }
  return `<div class="field-row"><label>${esc(f.label)}</label>
    <textarea rows="2" data-field-input="${esc(f.id)}">${esc(val.value)}</textarea></div>`;
}

function renderCorrectiveList(){
  if (formCorrective.length===0) return `<div class="empty" style="padding:14px 0;">Belum ada tindakan ditambahkan</div>`;
  return formCorrective.map((c,i)=>`
    <div class="corrective-row">
      <button class="corrective-del" data-del-corrective="${i}">🗑</button>
      <input type="text" placeholder="No WR" data-corr-field="${i}|noWR" value="${esc(c.noWR)}">
      <input type="text" placeholder="Deskripsi tindakan" data-corr-field="${i}|deskripsi" value="${esc(c.deskripsi)}">
      <input type="text" placeholder="Tanggung jawab" data-corr-field="${i}|tanggungJawab" value="${esc(c.tanggungJawab)}">
      <input type="text" placeholder="Tenggat pengerjaan" data-corr-field="${i}|tenggat" value="${esc(c.tenggat)}">
    </div>
  `).join("");
}

async function submitEntry(){
  if (activeMode !== APP_MODES.OPERATOR) return;
  const area = state.areas.find(a=>a.id===selectedArea);
  const fields = state.templates[area.id]||[];
  if (!formOperator.trim()){ formError="Nama operator wajib diisi."; render(); return; }
  const ratingFields = fields.filter(f=>f.type==="rating");
  const missingRatings = ratingFields.filter(f=>{
    const v = formValues[f.id]||{};
    return v.rating===undefined;
  });
  if (missingRatings.length>0){ formError="Checklist belum lengkap. Silakan isi semua poin terlebih dahulu."; render(); return; }

  const missingTemuan = ratingFields.filter(f=>{
    const v = formValues[f.id]||{};
    return v.rating===1 && !String(v.temuan||"").trim();
  });
  if (missingTemuan.length>0){ formError="Temuan wajib diisi untuk setiap poin dengan rating 1 (Tidak Aman)."; render(); return; }

  const missing = fields.filter(f=>{
    const v = formValues[f.id]||{};
    if (f.type==="checkbox") return v.value===undefined;
    if (f.type==="number") return v.value===undefined || v.value==="";
    return false;
  });
  if (missing.length>0){ formError=`Masih ada ${missing.length} poin yang belum diisi.`; render(); return; }

  const entry = {
    id: uid("e"), areaId: area.id, areaName: area.name, shift: formShift,
    crew: formCrew, operator: formOperator.trim(), lhForeman: "", datetime: new Date().toISOString(),
    values: formValues, correctiveActions: formCorrective, confirmed: false,
    areaToken: session ? session.token : ""
  };
  toast("Menyimpan…");
  const submitButton = document.querySelector("[data-submit-entry]");
  const res = await runApiAction("addEntry", entry, submitButton, "Menyimpan...");
  if (!res) return;
  if (res.ok){
    await refreshSilently();
    selectedArea = session ? session.areaId : null;
    formValues={}; formOperator=""; formCrew=CREWS[0]; formError=""; formCorrective=[];
    render();
    toast("Cek sheet tersimpan");
  } else if (handleSessionFailure(res)) {
    return;
  } else {
    toast("Gagal menyimpan: "+(res.error||""), true);
  }
}

// ---------- TAB: KELOLA AREA ----------
let showAddAreaForm = false;
let expandedArea = null;

function renderKelola(){
  let html = `<button class="btn-dark" data-toggle-addarea="1">+ Tambah Area Baru</button>`;
  if (showAddAreaForm){
    html += `<div class="card">
      <input type="text" id="newAreaName" placeholder="Nama area (mis. Cyanide Tank Area)" style="margin-bottom:8px;">
      <input type="text" id="newAreaCode" placeholder="Kode form (mis. TT-PRO-FO-XX-XXX)" style="font-family:monospace;margin-bottom:10px;">
      <div style="display:flex;gap:8px;">
        <button class="btn-secondary" data-cancel-addarea="1">Batal</button>
        <button class="btn-primary" data-save-addarea="1">Simpan Area</button>
      </div>
    </div>`;
  }
  html += state.areas.map(a=>{
    const fields = (state.templates[a.id]||[]).slice().sort(compareOrder);
    const groups = groupBySection(fields);
    const open = expandedArea===a.id;
    let inner = "";
    if (open){
      let listHtml = "";
      Object.keys(groups).forEach(sec=>{
        listHtml += `<div style="font-size:11px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;margin:10px 0 4px;">${esc(sec)}</div>`;
        groups[sec].forEach(f=> listHtml += `<div class="field-item">
          <span>${esc(f.label)}<span class="type">${FIELD_TYPES.find(t=>t.value===f.type)?.label||f.type}</span></span>
          <button class="del-x" data-remove-field="${esc(a.id)}|${esc(f.id)}">🗑</button>
        </div>`);
      });
      inner = `<div style="border-top:1px solid var(--line);padding-top:10px;margin-top:6px;">
        <button class="link-btn" data-toggle-active="${esc(a.id)}" style="text-decoration:underline;">${a.active?'Nonaktifkan area ini':'Aktifkan area ini'}</button>
        ${listHtml}
        <div class="add-field-grid">
          <input type="text" placeholder="Kategori (mis. General)" data-newfield-section="${esc(a.id)}">
          <select data-newfield-type="${esc(a.id)}">
            ${FIELD_TYPES.map(t=>`<option value="${t.value}">${t.label}</option>`).join("")}
          </select>
          <div class="add-field-full">
            <input type="text" placeholder="Poin cek baru" data-newfield-label="${esc(a.id)}" style="flex:1;">
            <button data-add-field="${esc(a.id)}">+ Tambah</button>
          </div>
        </div>
      </div>`;
    }
    return `<div class="card">
      <button class="area-row" data-toggle-expand="${esc(a.id)}" style="width:100%;">
        <div>
          <div class="area-name">${esc(a.name)} ${!a.active?'<span class="badge pending" style="margin-left:6px;">Nonaktif</span>':''}</div>
          <div class="area-code">${esc(a.code)}</div>
        </div>
        <span class="chev" style="transform:${open?'rotate(90deg)':'none'};display:inline-block;">›</span>
      </button>
      ${inner}
    </div>`;
  }).join("");
  return html;
}

// ---------- TAB: RIWAYAT ----------
let filterArea = "all";

function renderRiwayat(){
  const sorted = state.entries
    .filter(e => filterArea==="all" || e.areaId===filterArea)
    .slice().sort((a,b)=> new Date(b.datetime) - new Date(a.datetime));

  const showAreaFilter = activeMode === APP_MODES.LH_FOREMAN;
  let html = `<div class="toolbar">
    ${showAreaFilter ? `<select id="filterAreaSelect">
      <option value="all">Semua Area</option>
      ${state.areas.map(a=>`<option value="${esc(a.id)}" ${filterArea===a.id?'selected':''}>${esc(a.name)}</option>`).join("")}
    </select>` : ""}
    <button class="export-btn" data-export-csv="1">Export CSV</button>
  </div>`;

  if (sorted.length===0){ html += `<div class="empty">Belum ada riwayat cek sheet.</div>`; return html; }

  html += sorted.map(e=>{
    const templates = (state.templates[e.areaId]||[]).slice().sort(compareOrder);
    const pointCount = templates.length;
    const findings = Object.entries(e.values || {})
      .map(([fieldId, value])=>{
        const field = templates.find(item=>item.id===fieldId);
        if (!field || Number(value?.rating)!==1) return null;
        return {label:field.label, temuan:value?.temuan||"", section:field.section||"", order:field.order};
      })
      .filter(Boolean)
      .sort((a,b)=>compareOrder(a,b));
    const visibleFindings = findings.slice(0,3);
    const remainingFindings = findings.length - visibleFindings.length;
    const findingsHtml = findings.length ? `<div class="history-findings">
        <div class="history-findings-title">⚠ ${findings.length} Tidak Aman</div>
        ${visibleFindings.map(f=>`<div class="history-finding">
          <div class="history-finding-label">• ${esc(f.label)}</div>
          <div class="history-finding-comment">Temuan: ${esc(f.temuan || "Temuan belum dicatat")}</div>
        </div>`).join("")}
        ${remainingFindings>0 ? `<div class="history-finding-comment">+ ${remainingFindings} temuan lainnya</div>` : ""}
      </div>` : `<div class="history-normal">✓ Semua pemeriksaan normal</div>`;
    const confirmed = isConfirmed(e);
    const confirmationHtml = activeMode === APP_MODES.OPERATOR && confirmed
      ? `<div class="history-confirmation">
        ${e.lhForeman ? `<div>LH/Foreman: <b>${esc(e.lhForeman)}</b></div>` : ""}
        ${e.lhComment ? `<div class="history-comment">💬 ${esc(e.lhComment)}</div>` : ""}
      </div>`
      : "";
    return `<div class="card history-card" data-open-entry="${esc(e.id)}">
      <div class="entry-header">
        <div class="history-title">
          <span class="history-dot"></span>
          <div class="area-name">${esc(e.areaName)}</div>
        </div>
        <span class="badge ${confirmed ? 'confirmed':'pending'}">${confirmed ? '🟢 Terkonfirmasi':'🟡 Menunggu Konfirmasi'}</span>
      </div>
      <div class="history-meta">
        <div class="history-subline">
          <span>Operator: <b>${esc(e.operator)}</b></span>
          <span>${esc(e.crew)}</span>
          <span>${esc(e.shift)}</span>
        </div>
        <div class="history-bottomline">
          <span class="history-datetime">${new Date(e.datetime).toLocaleString('id-ID')}</span>
          <span class="history-points">${pointCount} poin</span>
        </div>
      </div>
      ${findingsHtml}
      ${confirmationHtml}
      <span class="history-chevron">›</span>
    </div>`;
  }).join("");
  return html;
}

function exportCSV(){
  const sorted = state.entries.filter(e => filterArea==="all" || e.areaId===filterArea);
  if (sorted.length===0){ toast("Tidak ada data untuk diexport", true); return; }
  const rows = [["Area","Kode","Shift","Operator","Waktu","Kategori","Poin Cek","Nilai","Temuan","Terkonfirmasi"]];
  sorted.forEach(e=>{
    const fields = state.templates[e.areaId]||[];
    const area = state.areas.find(a=>a.id===e.areaId);
    const values = e.values || {};
    const confirmedStr = (e.confirmed===true||e.confirmed==='TRUE'||e.confirmed==='true') ? "Ya" : "Belum";
    fields.forEach(f=>{
      const v = values[f.id]||{};
      let val = "-";
      if (f.type==="rating") val = v.rating ? RATING_LABELS[v.rating] : "-";
      else if (f.type==="checkbox") val = v.value==="ok"?"OK":"Tidak";
      else val = v.value||"-";
      rows.push([e.areaName, area?area.code:"", e.shift, e.operator, new Date(e.datetime).toLocaleString('id-ID'), f.section||"Umum", f.label, val, v.temuan||"", confirmedStr]);
    });
  });
  const csv = rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob = new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `cek-sheet-export-${todayKey(new Date())}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

// ---------- EVENT HANDLERS ----------
function attachHandlers(){
  const logoutButton = document.querySelector("[data-logout]");
  if (logoutButton) logoutButton.onclick = logout;

  document.querySelectorAll("[data-open-entry]").forEach(el=>{
    el.onclick = ()=>{
      const entry = state.entries.find(item => item.id === el.dataset.openEntry);
      if (entry) openEntryForConfirmation(entry);
    };
  });
  const closeEntry = document.querySelector("[data-close-entry]");
  if (closeEntry) closeEntry.onclick = ()=>{
    selectedEntryId = null;
    confirmationError = "";
    render();
  };
  const lhForemanInput = document.getElementById("lhForemanInput");
  if (lhForemanInput) lhForemanInput.oninput = (e)=>{ formLHForeman = e.target.value; };
  const lhCommentInput = document.getElementById("lhCommentInput");
  if (lhCommentInput) lhCommentInput.oninput = (e)=>{ formLHComment = e.target.value; };
  const confirmButton = activeMode === APP_MODES.LH_FOREMAN && selectedEntryId
    ? document.querySelector("[data-confirm-entry]")
    : null;
  if (confirmButton) confirmButton.onclick = (event)=>{
    event.preventDefault();
    confirmEntry();
  };

  document.querySelectorAll("[data-open-area]").forEach(el=>{
    el.onclick = ()=>{ selectedArea = el.dataset.openArea; activeFieldIndex=0; formValues={}; formError=""; formCorrective=[]; formCrew=CREWS[0]; render(); };
  });
  const cancelForm = document.querySelector("[data-cancel-form]");
  if (cancelForm) cancelForm.onclick = ()=>{ selectedArea=null; render(); };

  document.querySelectorAll("[data-shift]").forEach(el=>{
    el.onclick = ()=>{ formShift = el.dataset.shift; render(); };
  });
  const opInput = document.getElementById("operatorInput");
  if (opInput) opInput.oninput = (e)=>{ formOperator = e.target.value; updateHeaderIdentity(); };
  document.querySelectorAll("[data-crew]").forEach(el=>{
    el.onclick = ()=>{ formCrew = el.dataset.crew; render(); };
  });
  document.querySelectorAll("[data-field]").forEach(el=>{
    el.onclick = ()=>{ formValues[el.dataset.field] = { value: el.dataset.val }; render(); };
  });
  document.querySelectorAll("[data-field-input]").forEach(el=>{
    el.oninput = (e)=>{ formValues[el.dataset.fieldInput] = { value: e.target.value }; };
  });
  document.querySelectorAll("[data-rating-field]").forEach(el=>{
    el.onclick = ()=>{
      const id = el.dataset.ratingField;
      const cur = formValues[id] || {};
      formValues[id] = { ...cur, rating: parseInt(el.dataset.r,10) };
      render();
    };
  });
  document.querySelectorAll("[data-temuan-field]").forEach(el=>{
    el.oninput = (e)=>{
      const id = el.dataset.temuanField;
      const cur = formValues[id] || {};
      formValues[id] = { ...cur, temuan: e.target.value };
    };
  });
  const previousField = document.querySelector("[data-prev-field]");
  if (previousField) previousField.onclick = ()=> setActiveFieldIndex(activeFieldIndex - 1);
  const nextField = document.querySelector("[data-next-field]");
  if (nextField) nextField.onclick = ()=> setActiveFieldIndex(activeFieldIndex + 1);

  const addCorrective = document.querySelector("[data-add-corrective]");
  if (addCorrective) addCorrective.onclick = ()=>{
    formCorrective.push({noWR:"",deskripsi:"",tanggungJawab:"",tenggat:""});
    render();
  };
  document.querySelectorAll("[data-corr-field]").forEach(el=>{
    el.oninput = (e)=>{
      const [idx, key] = el.dataset.corrField.split("|");
      formCorrective[parseInt(idx,10)][key] = e.target.value;
    };
  });
  document.querySelectorAll("[data-del-corrective]").forEach(el=>{
    el.onclick = ()=>{ formCorrective.splice(parseInt(el.dataset.delCorrective,10),1); render(); };
  });
  const submitBtn = document.querySelector("[data-submit-entry]");
  if (submitBtn) submitBtn.onclick = submitEntry;

  const toggleAddArea = document.querySelector("[data-toggle-addarea]");
  if (toggleAddArea) toggleAddArea.onclick = ()=>{
    if (activeMode !== APP_MODES.LH_FOREMAN) return;
    showAddAreaForm = !showAddAreaForm;
    render();
  };
  const cancelAddArea = document.querySelector("[data-cancel-addarea]");
  if (cancelAddArea) cancelAddArea.onclick = ()=>{
    if (activeMode !== APP_MODES.LH_FOREMAN) return;
    showAddAreaForm=false;
    render();
  };
  const saveAddArea = document.querySelector("[data-save-addarea]");
  if (saveAddArea) saveAddArea.onclick = async ()=>{
    if (activeMode !== APP_MODES.LH_FOREMAN) return;
    const name = document.getElementById("newAreaName").value.trim();
    const code = document.getElementById("newAreaCode").value.trim();
    if (!name){ toast("Nama area wajib diisi", true); return; }
    const res = await runApiAction("addArea", {
      id:uid("area"), name, code,
      authToken: lhSession ? lhSession.authToken : ""
    }, saveAddArea, "Menyimpan...");
    if (!res) return;
    if (res.ok){ await refreshSilently(); showAddAreaForm=false; render(); toast("Area ditambahkan"); }
    else if (handleSessionFailure(res)) return;
    else toast("Gagal: "+(res.error||""), true);
  };

  document.querySelectorAll("[data-toggle-expand]").forEach(el=>{
    el.onclick = ()=>{ expandedArea = expandedArea===el.dataset.toggleExpand ? null : el.dataset.toggleExpand; render(); };
  });
  document.querySelectorAll("[data-toggle-active]").forEach(el=>{
    el.onclick = async ()=>{
      if (activeMode !== APP_MODES.LH_FOREMAN) return;
      const id = el.dataset.toggleActive;
      const area = state.areas.find(a=>a.id===id);
      const res = await runApiAction("toggleArea", {
        id, active: !area.active,
        authToken: lhSession ? lhSession.authToken : ""
      }, el, "Memproses...");
      if (!res) return;
      if (res.ok){ await refreshSilently(); render(); }
      else if (handleSessionFailure(res)) return;
    };
  });
  document.querySelectorAll("[data-add-field]").forEach(el=>{
    el.onclick = async ()=>{
      if (activeMode !== APP_MODES.LH_FOREMAN) return;
      const areaId = el.dataset.addField;
      const labelInput = document.querySelector(`[data-newfield-label="${areaId}"]`);
      const typeSelect = document.querySelector(`[data-newfield-type="${areaId}"]`);
      const sectionInput = document.querySelector(`[data-newfield-section="${areaId}"]`);
      const label = labelInput.value.trim();
      if (!label) return;
      const order = (state.templates[areaId]||[]).length + 1;
      const res = await runApiAction("addField", {
        id:uid("f"), areaId, label, type:typeSelect.value, order,
        section: sectionInput.value.trim() || "Umum",
        authToken: lhSession ? lhSession.authToken : ""
      }, el, "Menambahkan...");
      if (!res) return;
      if (res.ok){ await refreshSilently(); render(); }
      else if (handleSessionFailure(res)) return;
      else toast("Gagal: "+(res.error||""), true);
    };
  });
  document.querySelectorAll("[data-remove-field]").forEach(el=>{
    el.onclick = async ()=>{
      if (activeMode !== APP_MODES.LH_FOREMAN) return;
      const [areaId, fieldId] = el.dataset.removeField.split("|");
      const res = await runApiAction("removeField", {
        id: fieldId,
        authToken: lhSession ? lhSession.authToken : ""
      }, el, "Menghapus...");
      if (!res) return;
      if (res.ok){ await refreshSilently(); render(); }
      else if (handleSessionFailure(res)) return;
    };
  });

  const filterSelect = document.getElementById("filterAreaSelect");
  if (filterSelect) filterSelect.onchange = (e)=>{ filterArea = e.target.value; render(); };
  const exportBtn = document.querySelector("[data-export-csv]");
  if (exportBtn) exportBtn.onclick = exportCSV;
  document.querySelectorAll("[data-delete-entry]").forEach(el=>{
    el.onclick = async ()=>{
      if (activeMode !== APP_MODES.LH_FOREMAN) return;
      if (!confirm("Hapus entri cek sheet ini?")) return;
      const res = await runApiAction("deleteEntry", {
        id: el.dataset.deleteEntry,
        authToken: lhSession ? lhSession.authToken : ""
      }, el, "Menghapus...");
      if (!res) return;
      if (res.ok){ await refreshSilently(); render(); toast("Entri dihapus"); }
      else if (handleSessionFailure(res)) return;
      else toast("Gagal menghapus: "+(res.error||""), true);
    };
  });
}

document.querySelectorAll("nav button").forEach(b=>{ b.onclick = ()=> setTab(b.dataset.tab); });

restoreSession();
renderRoot();
</script>
